# Private LOCAL demo only. Production remains closed until a verified identity adapter.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      RISKLENS_ENV: development
      RISKLENS_PROVIDER: local
      RISKLENS_ENABLE_VERTEX: "false"
      RISKLENS_STORAGE_DIR: /data
    volumes:
      - risklens-data:/data
    ports:
      - "127.0.0.1:8000:8000"
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      RISKLENS_BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  risklens-data:
